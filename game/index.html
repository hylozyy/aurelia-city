<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Atlantic — Azure Cove</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b2030; font-family: "Arial Narrow", Arial, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; user-select: none; }
  .panel { position: absolute; text-shadow: 0 1px 3px rgba(0,0,0,.65); }
  #minimap { position: absolute; left: 14px; top: 14px; width: 188px; height: 188px; border-radius: 10px; background: rgba(6,24,38,.72); border: 2px solid rgba(255,220,140,.85); box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #money { left: 16px; bottom: 64px; font-size: 26px; font-weight: bold; letter-spacing: 1px; color: #9fe8a5; }
  #money .cur { font-size: 16px; color: #cdeecd; }
  #wanted { left: 16px; bottom: 26px; }
  #wanted .label { font-size: 11px; letter-spacing: 2px; color: #ffd9a0; display: block; margin-bottom: 2px; }
  #wanted .stars { font-size: 24px; line-height: 1; color: #ffb23f; text-shadow: 0 0 8px rgba(255,140,0,.9); }
  #wanted .stars .off { color: rgba(255,255,255,.25); text-shadow: none; }
  #speedo { right: 18px; bottom: 40px; text-align: right; }
  #speed { font-size: 46px; font-weight: bold; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  #speed .u { font-size: 14px; color: #bcd; }
  #carname { font-size: 14px; color: #cfe3ff; letter-spacing: 1px; }
  #mission { left: 50%; top: 16px; transform: translateX(-50%); text-align: center; max-width: 720px; }
  #mission .mt { font-size: 21px; font-weight: bold; color: #ffe2a6; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #mission .mo { font-size: 15px; color: #fff; margin-top: 3px; text-shadow: 0 2px 5px rgba(0,0,0,.8); }
  #prompt { left: 50%; bottom: 12%; transform: translateX(-50%); font-size: 17px; font-weight: bold; color: #ffe9b0; text-shadow: 0 2px 6px rgba(0,0,0,.9); background: rgba(10,20,34,.45); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,220,150,.5); }
  #toasts { right: 16px; top: 16px; text-align: right; }
  .toast { background: rgba(8,18,30,.78); border-left: 4px solid #f5c542; padding: 7px 12px; margin-bottom: 7px; border-radius: 6px; font-size: 14px; max-width: 380px; animation: toastin .25s ease-out; }
  @keyframes toastin { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 6px rgba(0,0,0,.8); }
  #healthwrap { left: 16px; top: 6px; }
  #healthbar { width: 160px; height: 10px; background: rgba(0,0,0,.45); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,.4); }
  #healthbar > div { height: 100%; background: linear-gradient(90deg,#6ee27f,#39c95b); }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; background: radial-gradient(ellipse at 50% 30%, rgba(16,54,84,.55), rgba(4,12,22,.94)); text-align: center; }
  .overlay h1 { font-size: 74px; margin: 0; letter-spacing: 6px; font-weight: 900; color: #ffd976; text-shadow: 0 0 24px rgba(255,180,60,.8), 0 6px 12px rgba(0,0,0,.7); }
  .overlay h2 { font-size: 24px; margin: 6px 0 4px; letter-spacing: 12px; color: #bfe9ff; font-weight: normal; text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .overlay .tag { font-size: 15px; color: #ffd9a0; margin-bottom: 22px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .controls { display: grid; grid-template-columns: auto auto; gap: 4px 18px; font-size: 15px; color: #eaf6ff; margin-bottom: 24px; text-align: left; }
  .controls b { color: #ffe2a6; font-weight: bold; }
  .btn { pointer-events: auto; cursor: pointer; font: inherit; font-size: 22px; font-weight: bold; letter-spacing: 2px; padding: 13px 46px; border-radius: 34px; border: 2px solid #ffd976; background: rgba(255,176,40,.16); color: #ffe9b0; text-shadow: 0 2px 5px rgba(0,0,0,.8); box-shadow: 0 0 30px rgba(255,180,60,.25); }
  .btn:hover { background: rgba(255,176,40,.4); }
  .small { font-size: 13px; color: #9fc6e8; margin-top: 14px; }
  .hidden { display: none !important; }
  .bigmsg { font-size: 40px; font-weight: bold; letter-spacing: 3px; margin-bottom: 8px; }
  .won .bigmsg { color: #8fe39a; text-shadow: 0 0 24px rgba(120,255,150,.6); }
  .busted .bigmsg { color: #ff7d6b; text-shadow: 0 0 22px rgba(255,90,60,.6); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Atlantic: an open-world crime game set in the sunny coastal city of Azure Cove"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
